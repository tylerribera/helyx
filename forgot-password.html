<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — Helyx</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.helyx.us; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
</head>
<body>
    <nav class="nav" id="nav">
        <div class="nav__inner">
            <a href="index.html" class="nav__logo"><img src="assets/helyx-logo.png" alt="Helyx" class="nav__logo-img"></a>
            <div class="nav__links" id="nav-links">
                <a href="index.html#features" class="nav__link">Features</a>
                <a href="index.html#how-it-works" class="nav__link">How it works</a>
                <a href="about.html" class="nav__link">About</a>
            </div>
            <div class="nav__actions">
                <a href="login.html" class="nav__link nav__link--auth">Sign in</a>
                <button class="nav__mobile-toggle" id="mobile-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <main class="auth-wrap">
        <div class="auth-card">
            <div class="auth-card__head">
                <h1 class="auth-card__title">Reset your password</h1>
                <p class="auth-card__sub">Enter your email and we'll send a reset link.</p>
            </div>
            <form class="auth-form" id="forgot-form" novalidate>
                <div class="auth-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <button type="submit" class="btn btn--primary" style="width:100%; margin-top:8px;">Send reset link</button>
            </form>
            <p class="auth-card__foot">
                <a href="login.html">Back to sign in</a>
            </p>
        </div>
    </main>

    <footer class="footer">
        <div class="footer__inner">
            <div class="footer__brand">
                <img src="assets/helyx-logo.png" alt="Helyx" class="footer__logo">
                <p class="footer__tag">A quiet journal for the protocol you're already running.</p>
            </div>
            <div class="footer__links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
            </div>
            <div class="footer__legal">
                <a href="learn.html#privacy">Privacy</a>
                <a href="learn.html#terms">Terms</a>
                <a href="mailto:hello@helyx.us">hello@helyx.us</a>
            </div>
        </div>
        <div class="footer__bottom">
            <span>© 2026 Helyx.</span>
        </div>
    </footer>

    <script src="js/global.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
