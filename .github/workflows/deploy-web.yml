name: Deploy helyx.us

# Builds the web target and publishes it to GitHub Pages on every push to main.
#
# Requires the repository's Pages source to be set to "GitHub Actions"
# (Settings → Pages → Build and deployment → Source). The older "Deploy from a
# branch" setting will not run this workflow.

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead of cancelling, so a push that
# lands mid-deploy still ends up published rather than silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail the deploy before publishing rather than shipping broken content.
      # The content validator is the gate that keeps unreviewed compounds and
      # uncited claims off the public site.
      - name: Typecheck and validate content
        run: npm run check

      - name: Build static site
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SITE_URL: https://helyx.us
          # Set this repository variable once the app is registered on the App
          # Store; the iOS smart banner is omitted while it is empty, because a
          # banner pointing at a nonexistent app is worse than no banner.
          EXPO_PUBLIC_IOS_APP_ID: ${{ vars.EXPO_PUBLIC_IOS_APP_ID }}

      # GitHub Pages serves 404.html for any path it cannot resolve. Expo names
      # that page +not-found.html, so copy it across — without this, a mistyped
      # or stale URL gets GitHub's default 404 instead of the app's.
      - name: Wire up the 404 page
        run: |
          if [ -f dist/+not-found.html ]; then
            cp dist/+not-found.html dist/404.html
          fi

      # CNAME keeps helyx.us pointed at the site. It lives in public/ so the
      # export copies it into dist/; this check catches it going missing rather
      # than discovering it when the custom domain silently detaches.
      - name: Verify CNAME survived the build
        run: |
          if [ ! -f dist/CNAME ]; then
            echo "::error::dist/CNAME is missing — the custom domain would be dropped."
            exit 1
          fi
          echo "CNAME: $(cat dist/CNAME)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
